# Cron: 1st and 15th of each month at 06:00 UTC — bi-weekly, on
# predictable dates (vs. every-14-days which drifts). Index constituents
# change ~once per quarter, so this is a deliberately quiet cadence; a
# refresh that finds zero deltas exits without opening a PR.
#
# Escalation policy (matches `refresh-benchmarks.yml`):
#  - Red run is acceptable. No alert, no auto-retry. Previous-good JSON
#    stays in the bundle.
#  - Holdings outside the bundled map already fall into the "Unknown"
#    wedge — graceful degradation, by design.
#  - `concurrency` prevents pile-up across cron ticks.

name: Refresh sector classifications

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

concurrency:
  group: refresh-sectors
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch sector classifications
        run: node scripts/refresh-sectors.mjs

      - name: Validate updated JSON
        run: node scripts/validateData.mjs

      - name: Open PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-sectors
          commit-message: 'chore(data): bi-weekly sector refresh'
          title: 'chore(data): bi-weekly sector refresh'
          body: |
            Automated bi-weekly refresh of `src/data/sectors.json`.

            Sources:
            - US: `datasets/s-and-p-500-companies` (S&P 500 CSV mirror)
            - India: NSE archive CSV for NIFTY 100

            If this PR exists it means the fetch + validation passed
            and the JSON delta is non-empty (either constituent
            additions/removals or sector reclassifications upstream).

            Review checklist before merging:
            - Diff is a clean list of added / removed / re-classified
              entries — no full-file rewrite.
            - Total entry count stayed within the expected band
              (~503 US + ~100 INR; floors of 400 / 90 in the script).
            - `npm run validate:data` is green in CI.

            Rolling back: just `git revert` this PR. The previous-good
            JSON returns to `main` and `deploy.yml` redeploys.
          labels: |
            chore
            data
          add-paths: |
            src/data/sectors.json
